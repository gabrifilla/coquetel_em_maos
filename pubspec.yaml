name: coquetel_em_maos
description: Aplicativo que mostra quais coquetéis você consegue preparar com os ingredientes que tem em casa.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  image_path: "assets/icons/cocktailicon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/background/
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Pacifico.txt

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf

# Tela de abertura (iOS e Android): `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#150D28"
  image: assets/images/splash.png
  android_12:
    color: "#150D28"
    image: assets/images/splash.png
  ios_content_mode: center
  web: false
